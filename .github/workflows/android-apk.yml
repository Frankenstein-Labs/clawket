name: Android APK
# Manual and branch-push build for the OpenHands mobile candidate.

on:
  push:
    branches:
      - manus/openhands-cloud-integration
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: manus/openhands-cloud-integration
        type: string

permissions:
  contents: read

env:
  EXPO_NO_DOCTOR: '1'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        # This is a sideloadable test build, not the production store release.
        # Keep release optimization while using the project's explicit temporary
        # debug signing escape hatch; no signing secret is stored in the repo.
        run: ./gradlew app:assembleRelease -Pclawket.allowDebugReleaseSigning=true -x lint -x test --configure-on-demand --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openhands-android-release-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
