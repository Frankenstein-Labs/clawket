name: Android APK

on:
  push:
    branches:
      - manus/openhands-cloud-integration
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: manus/openhands-cloud-integration
        type: string

permissions:
  contents: read

env:
  EXPO_NO_DOCTOR: '1'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleDebug -x lint -x test --configure-on-demand --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openhands-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
