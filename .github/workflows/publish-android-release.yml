name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing the Android artifact
        required: true
        type: string
      artifact_name:
        description: Exact artifact name to publish
        required: true
        type: string
      release_tag:
        description: Release tag to create
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact from GitHub
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find artifact -type f -iname '*.apk' | head -n 1 || true)
          if [[ -z "$apk" ]]; then
            echo 'No APK found in the selected artifact.' >&2
            find artifact -type f -maxdepth 5 -print >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "OpenHands Mobile Android — $TAG" \
            --notes "APK Android release optimisé, compilé par GitHub Actions depuis l’exécution #${{ inputs.source_run_id }}."
