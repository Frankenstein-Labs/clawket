plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.clawket.modules'
version = '1.0.0'

dependencies {
  compileOnly 'com.facebook.react:react-android'
}

android {
  namespace "com.clawket.qaviewport"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
